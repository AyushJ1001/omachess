<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Omachess application icon: a board corner with a king standing on it.

  It is drawn in flat, theme-independent colours so it reads the same in every
  Omarchy theme, and it is the only artwork the desktop entry names
  (Icon=com.omachess.Omachess).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="board">
      <rect x="8" y="8" width="112" height="112" rx="16"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="16" fill="#e8dcc4"/>
  <g clip-path="url(#board)" fill="#6b8f5e">
    <rect x="8" y="8" width="28" height="28"/>
    <rect x="64" y="8" width="28" height="28"/>
    <rect x="36" y="36" width="28" height="28"/>
    <rect x="92" y="36" width="28" height="28"/>
    <rect x="8" y="64" width="28" height="28"/>
    <rect x="64" y="64" width="28" height="28"/>
    <rect x="36" y="92" width="28" height="28"/>
    <rect x="92" y="92" width="28" height="28"/>
  </g>
  <rect x="8" y="8" width="112" height="112" rx="16" fill="none" stroke="#2f3628" stroke-width="6"/>

  <g fill="#22271c">
    <rect x="58" y="18" width="12" height="34" rx="3"/>
    <rect x="47" y="29" width="34" height="12" rx="3"/>
    <path d="M40 62c0-11 10-20 24-20s24 9 24 20c0 9-6 14-10 18l6 26H44l6-26c-4-4-10-9-10-18z"/>
    <rect x="34" y="106" width="60" height="14" rx="6"/>
  </g>
</svg>
